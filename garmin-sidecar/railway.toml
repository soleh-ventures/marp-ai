# Railway config for the Garmin sidecar.
# Deploy as a SEPARATE Railway service with Root Directory = garmin-sidecar.
#
# NOT a cron service. Railway's cronSchedule never fired this service reliably
# (a run-once container shows FAILED and the schedule never executed — proven by
# a heartbeat that never appeared over 3 weeks). Instead we run scheduler.py: a
# long-running process that ingests on startup and then once daily at 05:15 UTC,
# forever. It never exits, so Railway keeps it RUNNING; ON_FAILURE restarts it if
# it ever crashes.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python scheduler.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
